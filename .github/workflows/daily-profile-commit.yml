name: Daily profile commit

on:
  schedule:
    # 00:05 UTC is 09:05 in Japan Standard Time, Monday through Friday.
    - cron: "5 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-profile-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create profile commits
        run: |
          git config user.name "KaryouHan"
          git config user.email "pkl1241716365@gmail.com"

          jst_day="$(TZ=Asia/Tokyo date '+%u')"
          if [ "$jst_day" -ge 6 ]; then
            echo "Weekend in Japan; skipping profile commit."
            exit 0
          fi

          commit_count=1
          if [ "$jst_day" = "3" ]; then
            commit_count=5
          fi

          for i in $(seq 1 "$commit_count"); do
            commit_date="$(TZ=Asia/Tokyo date -d "+$i seconds" '+%Y-%m-%dT%H:%M:%S%z')"
            message="chore: daily profile commit"
            if [ "$commit_count" -gt 1 ]; then
              message="chore: weekly profile commit $i/$commit_count"
            fi
            GIT_AUTHOR_DATE="$commit_date" GIT_COMMITTER_DATE="$commit_date" git commit --allow-empty -m "$message"
          done

          git push
